<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur automatique de quiz PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- React 18 + Babel standalone : pas de build npm nécessaire -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<style>
  :root{
    --paper: #EEF0EA;
    --paper-alt: #E4E7DC;
    --ink: #1E2A2F;
    --muted: #5B6960;
    --highlight: #D7E24B;
    --teal: #2E8B7C;
    --coral: #E4572E;
    --card: #FBFBF7;
    --line: rgba(30,42,47,0.12);
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  html,body,#root{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app{ max-width: 1080px; margin: 0 auto; padding: 0 28px 80px; }
  h1,h2,h3{ font-family: 'Lora', serif; margin: 0; }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 14px;
  }

  .hero{ padding: 60px 0 40px; }
  .hero h1{ font-size: clamp(30px, 5vw, 48px); font-weight: 600; line-height: 1.14; letter-spacing: -0.01em; max-width: 720px; }
  .lede{ font-size: 16.5px; color: var(--muted); max-width: 580px; margin: 16px 0 8px; }
  .stack-note{
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted);
    display: inline-flex; align-items: center; gap: 8px; margin-top: 6px;
  }
  .dot{ width: 7px; height: 7px; border-radius: 50%; background: var(--teal); display: inline-block; }
  .dot.off{ background: var(--coral); }

  .panel{
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px; margin-top: 32px;
  }

  .upload-zone{
    border: 1.5px dashed var(--line); border-radius: var(--radius);
    padding: 32px; text-align: center; cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .upload-zone:hover, .upload-zone.dragover{ border-color: var(--teal); background: var(--paper-alt); }
  .upload-zone input{ display: none; }
  .upload-zone .icon{ font-size: 28px; margin-bottom: 8px; }
  .upload-zone .filename{
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--teal); margin-top: 10px;
  }

  .controls{ display: flex; align-items: center; gap: 18px; margin-top: 22px; flex-wrap: wrap; }
  .controls label{ font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .controls input[type=range]{ accent-color: var(--teal); width: 140px; }

  #generateBtn{
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14.5px;
    padding: 12px 24px; border-radius: 10px; border: none;
    background: var(--ink); color: var(--paper); cursor: pointer;
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  #generateBtn:disabled{ opacity: 0.4; cursor: not-allowed; }
  #generateBtn:not(:disabled):hover{ opacity: 0.88; }
  #generateBtn:not(:disabled):active{ transform: scale(0.98); }

  .error-box{
    margin-top: 18px; padding: 14px 16px; border-radius: 10px;
    background: rgba(228,87,46,0.09); border: 1px solid var(--coral);
    color: var(--coral); font-size: 13.5px;
  }

  .loading{
    margin-top: 22px; display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 14px;
  }
  .spinner{
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--teal);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .meta-row{
    display: flex; gap: 10px; margin: 22px 0 4px; flex-wrap: wrap;
  }
  .meta-badge{
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
    padding: 5px 10px; border-radius: 7px; background: var(--paper-alt); color: var(--muted);
  }

  .qcard{
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px 22px; margin-top: 14px;
    opacity: 0; transform: translateY(8px);
    animation: rise 0.35s ease-out forwards;
  }
  @keyframes rise{ to{ opacity: 1; transform: translateY(0); } }
  .qcard .qn{
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 8px;
  }
  .qcard .qt{ font-family: 'Lora', serif; font-size: 17px; margin: 0 0 14px; }

  .choice{
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 9px; border: 1px solid var(--line); margin-bottom: 8px;
    cursor: pointer; font-size: 14px; transition: background 0.12s ease, border-color 0.12s ease;
  }
  .choice:hover{ background: var(--paper-alt); }
  .choice input{ accent-color: var(--ink); }
  .choice.correct{ border-color: var(--teal); background: rgba(46,139,124,0.09); }
  .choice.wrong{ border-color: var(--coral); background: rgba(228,87,46,0.09); }

  #submitBtn{
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14.5px;
    padding: 11px 22px; border-radius: 10px; border: none;
    background: var(--teal); color: white; cursor: pointer; margin-top: 18px;
  }
  #submitBtn:hover{ opacity: 0.9; }
  #submitBtn:disabled{ opacity: 0.4; cursor: not-allowed; }

  .score-banner{
    background: var(--ink); color: var(--paper); border-radius: var(--radius);
    padding: 18px 22px; font-family: 'Lora', serif; font-size: 17px; margin-top: 20px;
    opacity: 0; animation: rise 0.4s ease-out forwards;
  }
  .score-banner span{ font-family: 'Caveat', cursive; font-size: 22px; color: var(--highlight); }

  .reset-link{
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--muted);
    text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0; margin-top: 14px;
  }

  footer{ padding: 50px 0 10px; border-top: 1px solid var(--line); margin-top: 40px; }
  .badges{ display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .badge{
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 6px 11px;
    border-radius: 7px; background: var(--card); border: 1px solid var(--line); color: var(--muted);
  }
  footer p{ font-size: 13px; color: var(--muted); max-width: 620px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const API_BASE = "http://localhost:5000";

function ApiStatus() {
  const [online, setOnline] = useState(null);

  useEffect(() => {
    fetch(`${API_BASE}/api/health`)
      .then(r => r.ok ? setOnline(true) : setOnline(false))
      .catch(() => setOnline(false));
  }, []);

  if (online === null) return null;
  return (
    <span className="stack-note">
      <span className={`dot ${online ? "" : "off"}`}></span>
      API Flask {online ? "connectée (localhost:5000)" : "injoignable — lance `python app.py` dans backend/"}
    </span>
  );
}

function UploadZone({ file, setFile }) {
  const [dragOver, setDragOver] = useState(false);

  const onDrop = useCallback((e) => {
    e.preventDefault();
    setDragOver(false);
    const f = e.dataTransfer.files[0];
    if (f && f.type === "application/pdf") setFile(f);
  }, [setFile]);

  return (
    <div
      className={`upload-zone ${dragOver ? "dragover" : ""}`}
      onClick={() => document.getElementById("fileInput").click()}
      onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
      onDragLeave={() => setDragOver(false)}
      onDrop={onDrop}
    >
      <div className="icon">📄</div>
      <div>{file ? "Changer de fichier" : "Dépose un PDF ici, ou clique pour en choisir un"}</div>
      {file && <div className="filename">{file.name}</div>}
      <input
        id="fileInput"
        type="file"
        accept="application/pdf"
        onChange={(e) => setFile(e.target.files[0] || null)}
      />
    </div>
  );
}

function QuizCard({ item, index, selected, onSelect, revealed }) {
  return (
    <div className="qcard" style={{ animationDelay: `${index * 0.06}s` }}>
      <p className="qn">Question {index + 1}</p>
      <p className="qt">{item.question}</p>
      {item.choices.map((choice, ci) => {
        let cls = "choice";
        if (revealed) {
          if (ci === item.correct_index) cls += " correct";
          else if (ci === selected) cls += " wrong";
        }
        return (
          <label key={ci} className={cls}>
            <input
              type="radio"
              name={`q${index}`}
              disabled={revealed}
              checked={selected === ci}
              onChange={() => onSelect(index, ci)}
            />
            <span>{choice}</span>
          </label>
        );
      })}
    </div>
  );
}

function App() {
  const [file, setFile] = useState(null);
  const [nQuestions, setNQuestions] = useState(6);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [quiz, setQuiz] = useState(null);
  const [answers, setAnswers] = useState({});
  const [revealed, setRevealed] = useState(false);
  const [score, setScore] = useState(null);

  const handleGenerate = async () => {
    if (!file) return;
    setLoading(true);
    setError(null);
    setQuiz(null);
    setAnswers({});
    setRevealed(false);
    setScore(null);

    const formData = new FormData();
    formData.append("file", file);
    formData.append("n_questions", nQuestions);

    try {
      const res = await fetch(`${API_BASE}/api/generate-quiz`, {
        method: "POST",
        body: formData,
      });
      const data = await res.json();
      if (!res.ok) {
        setError(data.error || "Une erreur est survenue.");
      } else {
        setQuiz(data);
      }
    } catch (e) {
      setError("Impossible de contacter l'API. Vérifie que le serveur Flask tourne bien sur le port 5000.");
    } finally {
      setLoading(false);
    }
  };

  const handleSelect = (qIndex, choiceIndex) => {
    if (revealed) return;
    setAnswers(prev => ({ ...prev, [qIndex]: choiceIndex }));
  };

  const handleSubmit = () => {
    let s = 0;
    quiz.questions.forEach((q, i) => {
      if (answers[i] === q.correct_index) s++;
    });
    setScore(s);
    setRevealed(true);
  };

  const handleReset = () => {
    setQuiz(null);
    setAnswers({});
    setRevealed(false);
    setScore(null);
    setFile(null);
  };

  return (
    <div className="app">
      <header className="hero">
        <p className="eyebrow">Projet ML · Génération automatique de quiz</p>
        <h1>Un PDF entre. Un quiz sort.</h1>
        <p className="lede">
          Pipeline hybride (règles linguistiques + modèle T5) exposé via une API Flask,
          consommée ici par une interface React. Dépose un document PDF, en français ou en anglais.
        </p>
        <ApiStatus />
      </header>

      <div className="panel">
        <UploadZone file={file} setFile={setFile} />

        <div className="controls">
          <label>
            Nombre de questions : <strong>{nQuestions}</strong>
            <input
              type="range" min="3" max="15" value={nQuestions}
              onChange={(e) => setNQuestions(parseInt(e.target.value))}
            />
          </label>
          <button id="generateBtn" onClick={handleGenerate} disabled={!file || loading}>
            {loading ? "Génération..." : "Générer le quiz →"}
          </button>
        </div>

        {loading && (
          <div className="loading">
            <span className="spinner"></span>
            Extraction du texte, détection de langue, génération des questions...
          </div>
        )}

        {error && <div className="error-box">{error}</div>}

        {quiz && (
          <>
            <div className="meta-row">
              <span className="meta-badge">Langue détectée : {quiz.language}</span>
              <span className="meta-badge">{quiz.num_questions} questions générées</span>
            </div>

            {quiz.questions.map((item, i) => (
              <QuizCard
                key={i}
                item={item}
                index={i}
                selected={answers[i]}
                onSelect={handleSelect}
                revealed={revealed}
              />
            ))}

            {!revealed ? (
              <button
                id="submitBtn"
                onClick={handleSubmit}
                disabled={Object.keys(answers).length < quiz.questions.length}
              >
                Valider mes réponses
              </button>
            ) : (
              <>
                <div className="score-banner">
                  Score : <span>{score} / {quiz.questions.length}</span>
                </div>
                <button className="reset-link" onClick={handleReset}>← Essayer un autre PDF</button>
              </>
            )}
          </>
        )}
      </div>

      <footer>
        <div className="badges">
          <span className="badge">React 18 (CDN)</span>
          <span className="badge">Flask API</span>
          <span className="badge">spaCy / regex fallback</span>
          <span className="badge">pdfplumber</span>
        </div>
        <p>
          Frontend React connecté en direct à l'API Flask du pipeline (backend/app.py).
          Aucune étape n'est simulée : chaque quiz généré ici est le résultat réel du
          traitement du PDF déposé.
        </p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
